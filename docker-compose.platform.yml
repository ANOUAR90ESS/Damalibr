services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - damalibr_redis:/data
    command: redis-server --appendonly yes

  worker:
    image: node:22-bookworm
    working_dir: /app
    environment:
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
      FFMPEG_PATH: /usr/bin/ffmpeg
    depends_on:
      - redis
    volumes:
      - ./:/app
    command: sh -c "apt-get update && apt-get install -y --no-install-recommends ffmpeg && echo Damalibr worker container ready && sleep infinity"

volumes:
  damalibr_redis:
